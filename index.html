<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>redretep github repos</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }
    h1 {
      margin-bottom: 16px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }
    p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h1>my github repos</h1>
  <ul id="repo-list"></ul>

  <script>
    const username = "redretep";
    const url = `https://api.github.com/users/${username}/repos?sort=updated&per_page=100`;

    fetch(url)
      .then(res => res.json())
      .then(repos => {
        const list = document.getElementById("repo-list");

        repos
          .filter(repo => !repo.fork)
          .forEach(repo => {
            const li = document.createElement("li");
            li.innerHTML = `
              <a href="${repo.html_url}" target="_blank">${repo.name}</a>
              <p>${repo.description || "no description"}</p>
            `;
            list.appendChild(li);
          });
      })
      .catch(err => {
        console.error(err);
      });
  </script>
</body>
</html>

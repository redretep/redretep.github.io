<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pidi - redretep</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            /* Material You 3 Green Dark Palette */
            --md-sys-color-primary: #86efac;
            --md-sys-color-on-primary: #00391c;
            --md-sys-color-primary-container: #00522c;
            --md-sys-color-on-primary-container: #a3ffc9;
            --md-sys-color-secondary: #b9ccbe;
            --md-sys-color-surface: #0b0f0c; 
            --md-sys-color-surface-container: #171d18;
            --md-sys-color-surface-container-high: #212922;
            --md-sys-color-on-surface: #e1e3df;
            --md-sys-color-on-surface-variant: #c1c9bf;
            --md-sys-color-outline: #8b938a;
            
            --f-display: 'Outfit', sans-serif;
            --f-body: 'Inter', sans-serif;
            --f-mono: 'JetBrains Mono', monospace;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            cursor: none !important;
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: var(--f-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- Stunning Background (No hard stops) --- */
        .bg-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, #111a14 0%, #0b0f0c 100%);
        }
        .bg-glow {
            position: absolute; top: -10%; left: 50%; width: 120%; height: 80%;
            background: radial-gradient(circle at center, rgba(134, 239, 172, 0.15) 0%, transparent 70%);
            transform: translateX(-50%);
            filter: blur(80px);
            animation: pulse 10s ease-in-out infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.5; transform: translateX(-50%) scale(1); } to { opacity: 1; transform: translateX(-50%) scale(1.1); } }

        /* --- Custom Green Cursor --- */
        #cursor-dot {
            position: fixed; top: 0; left: 0; width: 8px; height: 8px;
            background: var(--md-sys-color-primary); border-radius: 50%;
            pointer-events: none; z-index: 10000; transform: translate(-50%, -50%);
        }
        #cursor-ring {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px;
            border: 2px solid var(--md-sys-color-primary); border-radius: 50%;
            pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
            transition: width 0.3s var(--spring), height 0.3s var(--spring), border-width 0.3s;
        }
        .hovering #cursor-ring { width: 60px; height: 60px; border-width: 4px; background: rgba(134, 239, 172, 0.1); }

        /* --- M3 Top Navigation Bar --- */
        .m3-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 4rem; z-index: 1000;
            background: rgba(11, 15, 12, 0.7); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-brand { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; color: var(--md-sys-color-primary); }
        .nav-links { display: flex; gap: 8px; background: var(--md-sys-color-surface-container); padding: 6px; border-radius: 100px; }
        .nav-item {
            padding: 10px 24px; border-radius: 100px; text-decoration: none;
            color: var(--md-sys-color-on-surface-variant); font-family: var(--f-display);
            font-weight: 600; font-size: 0.9rem; transition: 0.3s var(--spring);
            display: flex; align-items: center; gap: 8px;
        }
        .nav-item:hover { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }
        .nav-item.active { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }

        /* --- Hero Section --- */
        .hero {
            padding-top: 200px; padding-bottom: 100px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .profile-wrapper { position: relative; margin-bottom: 2rem; }
        .profile-img {
            width: 140px; height: 140px; border-radius: 48px;
            border: 4px solid var(--md-sys-color-primary-container);
            animation: profileFloat 6s ease-in-out infinite;
        }
        @keyframes profileFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }

        /* --- Text Reveal Animations --- */
        .reveal-text { overflow: hidden; display: block; }
        .reveal-text span {
            display: block; transform: translateY(110%);
            animation: textRise 1s var(--spring) forwards;
        }
        @keyframes textRise { to { transform: translateY(0); } }

        .hero h1 {
            font-family: var(--f-display); font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800; line-height: 1; letter-spacing: -2px; margin-bottom: 1rem;
        }
        .hero p {
            max-width: 600px; font-size: 1.2rem; opacity: 0.8;
            animation: fadeIn 1.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Projects Grid --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
        .section-title { font-family: var(--f-display); font-size: 2.5rem; margin-bottom: 3rem; display: flex; align-items: center; gap: 1rem; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--md-sys-color-outline); opacity: 0.2; }

        .repo-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }
        .repo-card {
            background: var(--md-sys-color-surface-container); border-radius: 32px;
            padding: 2.5rem; transition: 0.4s var(--spring); position: relative;
            border: 1px solid transparent; display: flex; flex-direction: column;
        }
        .repo-card:hover {
            background: var(--md-sys-color-surface-container-high);
            transform: scale(1.02) translateY(-8px);
            border-color: var(--md-sys-color-primary);
        }
        .repo-card h3 { font-family: var(--f-display); font-size: 1.6rem; color: var(--md-sys-color-primary); margin-bottom: 0.5rem; }
        .repo-card p { opacity: 0.7; font-size: 0.95rem; margin-bottom: 2rem; flex-grow: 1; }
        .repo-meta { display: flex; gap: 1rem; font-family: var(--f-mono); font-size: 0.8rem; opacity: 0.6; }

        /* --- Modal System --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px); z-index: 2000; display: none;
            justify-content: center; align-items: center; padding: 2rem;
        }
        .modal-content {
            background: var(--md-sys-color-surface); width: 100%; max-width: 1000px;
            height: 85vh; border-radius: 40px; overflow: hidden;
            display: flex; flex-direction: column; animation: modalPop 0.5s var(--spring);
            border: 1px solid var(--md-sys-color-surface-container-high);
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.9) translateY(40px); } }

        .modal-header { padding: 2rem; background: var(--md-sys-color-surface-container); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 3rem; overflow-y: auto; flex: 1; color: #cbd5e1; }
        .modal-body h1, h2 { color: var(--md-sys-color-primary); font-family: var(--f-display); margin: 1.5rem 0 1rem; }
        .modal-body code { background: #000; padding: 0.2rem 0.4rem; border-radius: 6px; font-family: var(--f-mono); }
        .modal-body pre { background: #000; padding: 1.5rem; border-radius: 20px; overflow-x: auto; margin: 1rem 0; }

        .m3-btn {
            height: 56px; padding: 0 32px; border-radius: 100px;
            display: inline-flex; align-items: center; gap: 12px;
            font-family: var(--f-display); font-weight: 700; text-decoration: none;
            transition: 0.3s var(--spring); border: none; font-size: 1rem;
        }
        .btn-filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
        .btn-tonal { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
        .m3-btn:hover { transform: scale(1.05); border-radius: 20px; }

        /* Scroll Bar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--md-sys-color-surface); }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-surface-container-high); border-radius: 10px; }

        @media (max-width: 768px) {
            .m3-nav { padding: 0 1rem; height: 70px; }
            .nav-links { display: none; }
            .hero { padding-top: 140px; }
        }
    </style>
</head>
<body>

    <div class="bg-wrapper"><div class="bg-glow"></div></div>
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <nav class="m3-nav">
        <div class="nav-brand">redretep/pidi</div>
        <div class="nav-links">
            <a href="#" class="nav-item active"><span class="material-symbols-rounded">home</span> Home</a>
            <a href="#projects" class="nav-item"><span class="material-symbols-rounded">code</span> Projects</a>
            <a href="https://github.com/redretep" target="_blank" class="nav-item"><span class="material-symbols-rounded">link</span> GitHub</a>
        </div>
        <a href="mailto:peterdbaltes@gmail.com" class="m3-btn btn-tonal" style="height: 48px; padding: 0 20px; font-size: 0.9rem;">Contact</a>
    </nav>

    <header class="hero">
        <div class="profile-wrapper">
            <img src="https://github.com/redretep.png" alt="pidi" class="profile-img">
        </div>
        
        <h1 class="reveal-text">
            <span style="animation-delay: 0.1s;">hey, im pidi</span>
        </h1>
        <h1 class="reveal-text">
            <span style="color: var(--md-sys-color-primary); animation-delay: 0.3s;">the frontend dev</span>
        </h1>
        
        <p>im a 15y/o developer crafting high-end and expressive websites.</p>
    </header>

    <main class="container" id="projects">
        <h2 class="section-title">my projects</h2>
        
        <div id="loader" style="display: flex; justify-content: center; padding: 4rem;">
            <span class="material-symbols-rounded" style="animation: spin 2s linear infinite; font-size: 3rem; color: var(--md-sys-color-primary);">sync</span>
        </div>
        
        <div class="repo-grid" id="repo-grid"></div>
    </main>

    <footer style="padding: 6rem 2rem; text-align: center; opacity: 0.5; font-size: 0.9rem;">
        <p>© 2026 redretep • built with pure html, css and js</p>
    </footer>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">project details</h2>
                <button onclick="closeModal()" class="m3-btn btn-tonal" style="width: 48px; height: 48px; padding: 0; border-radius: 50%;">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div style="padding: 2rem; background: var(--md-sys-color-surface-container); display: flex; gap: 1rem;">
                <a id="modal-gh-link" href="#" target="_blank" class="m3-btn btn-filled">
                    <span class="material-symbols-rounded">open_in_new</span> View on GitHub
                </a>
            </div>
        </div>
    </div>

    <script>
        // Cursor Logic
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');

        window.addEventListener('mousemove', (e) => {
            const { clientX: x, clientY: y } = e;
            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;
            
            ring.animate({
                left: `${x}px`,
                top: `${y}px`
            }, { duration: 500, fill: "forwards" });

            if (e.target.closest('a, button, .repo-card')) {
                document.body.classList.add('hovering');
            } else {
                document.body.classList.remove('hovering');
            }
        });

        // Github Logic
        const USERNAME = 'redretep';
        async function loadRepos() {
            try {
                const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=12`);
                const repos = await res.json();
                const grid = document.getElementById('repo-grid');
                document.getElementById('loader').style.display = 'none';

                repos.forEach((repo, i) => {
                    const card = document.createElement('div');
                    card.className = 'repo-card';
                    card.style.animation = `fadeIn 0.8s ease-out forwards ${i * 0.1}s`;
                    card.style.opacity = 0;
                    
                    card.innerHTML = `
                        <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary); font-size: 2.5rem; margin-bottom: 1rem;">folder_open</span>
                        <h3>${repo.name}</h3>
                        <p>${repo.description || "A clean project exploring the frontiers of web development."}</p>
                        <div class="repo-meta">
                            <span><span class="material-symbols-rounded" style="font-size: 14px">star</span> ${repo.stargazers_count}</span>
                            <span><span class="material-symbols-rounded" style="font-size: 14px">code</span> ${repo.language || 'HTML'}</span>
                        </div>
                    `;
                    card.onclick = () => openRepo(repo);
                    grid.appendChild(card);
                });
            } catch (e) { console.error("GitHub fetch Error", e); }
        }

        async function openRepo(repo) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            document.getElementById('modal-title').innerText = repo.name;
            document.getElementById('modal-gh-link').href = repo.html_url;
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            body.innerHTML = '<p>fetching README content...</p>';

            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${repo.name}/readme`, {
                    headers: { 'Accept': 'application/vnd.github.raw' }
                });
                const content = res.ok ? await res.text() : '# ' + repo.name + '\nNo description found.';
                body.innerHTML = marked.parse(content);
            } catch (e) { body.innerHTML = 'Error loading repository data.'; }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = (e) => { if(e.target.id === 'modal') closeModal(); }
        
        // Init
        loadRepos();
    </script>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>

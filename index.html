<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>redreteps github!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1f17;
      color: #ecfdf5;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 24px;
      font-size: 28px;
      color: #34d399;
      animation: floatIn .6s ease both;
      letter-spacing: -0.5px;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    .repo {
      background: rgba(6, 95, 70, 0.3);
      border: 1px solid #065f46;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      animation: floatIn .5s ease both;
      position: relative;
      overflow: hidden;
    }
    .repo:hover {
      transform: translateY(-2px);
      background: rgba(6, 95, 70, 0.6);
      border-color: #34d399;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .repo-title { color: #6ee7b7; font-weight: 600; font-size: 18px; margin-bottom: 4px; }
    .repo-desc { font-size: 14px; color: #a7f3d0; line-height: 1.5; opacity: 0.9; }

    /* Viewer Panel */
    .viewer {
      position: fixed;
      inset: 0;
      background: #0b1f17;
      padding: 24px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }
    .viewer.open { transform: translateX(0); }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      position: sticky;
      top: 0;
      background: #0b1f17;
      padding-bottom: 12px;
      z-index: 10;
      border-bottom: 1px solid #065f46;
    }

    .back {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(6, 95, 70, 0.3);
      color: #34d399;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      transition: all .2s ease;
      border: 1px solid transparent;
    }
    .back:hover {
      background: rgba(52, 211, 153, 0.15);
      color: #6ee7b7;
      border-color: #34d399;
    }

    .actions { display: flex; gap: 12px; }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      gap: 8px;
      border-radius: 12px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: #34d399;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all .2s ease;
    }

    .icon-btn:hover {
      background: #34d399;
      color: #064e3b;
      border-color: #34d399;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(52, 211, 153, 0.25);
    }
    
    .icon-btn svg {
      width: 18px;
      height: 18px;
    }
    
    .icon-btn .github-icon { fill: currentColor; }
    .icon-btn .download-icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h2#repo-name {
      margin: 0;
      color: #ecfdf5;
      font-size: 24px;
    }

    .path {
      font-family: monospace;
      font-size: 13px;
      color: #6ee7b7;
      margin: 8px 0 20px 0;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      display: inline-block;
      animation: fadeIn .3s ease;
    }

    .file-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.03);
      color: #d1fae5;
      font-size: 14px;
      transition: all .2s ease;
      animation: slideIn .25s ease both;
    }
    .file:hover {
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.3);
      padding-left: 18px;
      color: #fff;
    }
    .file span { margin-right: 10px; opacity: 0.7; }
    
    .file.enter {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: #6ee7b7;
      font-weight: 600;
    }

    h3 { color: #6ee7b7; margin-top: 32px; border-bottom: 1px solid #065f46; padding-bottom: 8px; }
    
    .readme {
      background: #0f291e;
      border: 1px solid #065f46;
      padding: 24px;
      border-radius: 16px;
      margin-top: 16px;
      line-height: 1.6;
      font-size: 15px;
      animation: fadeIn .4s ease;
      color: #d1fae5;
    }

    .status-msg { opacity: .5; padding: 20px; font-style: italic; }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0b1f17; }
    ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }
  </style>
</head>
<body>
  <h1 id="header">redreteps repos</h1>
  <ul id="repo-list"></ul>
  <div id="repo-loading" class="status-msg">fetching the repositories...</div>

  <div class="viewer" id="viewer">
    <div class="topbar">
      <div class="back" onclick="closeRepo()">←</div>
      <div class="actions">
        <a id="open-github" class="icon-btn" target="_blank">
          <svg class="github-icon" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </a>
        <a id="download-zip" class="icon-btn" target="_blank">
          <svg class="download-icon" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          ZIP
        </a>
      </div>
    </div>

    <h2 id="repo-name"></h2>
    <div class="path" id="path">/</div>
    <div id="file-list" class="file-grid"></div>

    <h3>README.md</h3>
    <div class="readme" id="readme">loading...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const username = "redretep";
    let currentRepo = "";
    let currentPath = "";
    let allRepos = [];

    const repoList = document.getElementById("repo-list");
    const repoLoading = document.getElementById("repo-loading");
    const viewer = document.getElementById("viewer");
    const fileList = document.getElementById("file-list");
    const readmeBox = document.getElementById("readme");
    const openGithub = document.getElementById("open-github");
    const downloadZip = document.getElementById("download-zip");
    const pathBox = document.getElementById("path");
    const repoNameHeader = document.getElementById("repo-name");
    const header = document.getElementById("header");

    // Recursive fetch to handle pagination and get ALL repos
    async function fetchAllRepos(page = 1) {
      try {
        const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100&page=${page}`);
        const data = await response.json();
        
        if (Array.isArray(data) && data.length > 0) {
          allRepos = [...allRepos, ...data];
          // If we got a full page, there might be more
          if (data.length === 100) {
            return fetchAllRepos(page + 1);
          }
        }
        renderRepos();
      } catch (err) {
        console.error("Error fetching repos:", err);
        repoLoading.textContent = "failed to load repositories.";
      }
    }

    function renderRepos() {
      repoList.innerHTML = "";
      repoLoading.style.display = "none";
      
      // Sort all gathered repos by updated date
      allRepos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      
      const filtered = allRepos.filter(r => !r.fork);
      header.textContent = `redretep repos (${filtered.length})`;

      filtered.forEach(repo => {
        const li = document.createElement("li");
        li.className = "repo";
        li.innerHTML = `
          <div class="repo-title">${repo.name}</div>
          <div class="repo-desc">${repo.description || "no description provided"}</div>
        `;
        li.onclick = () => openRepo(repo.name);
        repoList.appendChild(li);
      });
    }

    function openRepo(name) {
      currentRepo = name;
      currentPath = "";
      viewer.classList.add("open");
      repoNameHeader.textContent = name;
      document.body.style.overflow = "hidden";

      openGithub.href = `https://github.com/${username}/${name}`;
      downloadZip.href = `https://github.com/${username}/${name}/archive/refs/heads/main.zip`;

      loadPath();
      loadReadme(name);
    }

    function loadReadme(name) {
      readmeBox.innerHTML = '<div style="opacity:0.6">fetching readme...</div>';
      fetch(`https://api.github.com/repos/${username}/${name}/readme`, {
        headers: { Accept: "application/vnd.github.v3.raw" }
      })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        const baseUrl = `https://raw.githubusercontent.com/${username}/${name}/main/`;
        readmeBox.innerHTML = marked.parse(text).replace(/src="\.\//g, `src="${baseUrl}`);
      })
      .catch(() => {
        readmeBox.innerHTML = '<div style="opacity:0.5; font-style: italic; text-align: center; padding: 20px;">no readme.md found</div>';
      });
    }

    async function loadPath() {
      fileList.innerHTML = '<div class="status-msg">loading files...</div>';
      pathBox.textContent = currentPath || "/";

      try {
        const r = await fetch(`https://api.github.com/repos/${username}/${currentRepo}/contents/${currentPath}`);
        const files = await r.json();
        fileList.innerHTML = "";
        
        if (!Array.isArray(files)) {
          fileList.innerHTML = `<div class="status-msg">${files.message || "unable to load content"}</div>`;
          return;
        }

        files.sort((a, b) => {
          if (a.type === b.type) return a.name.localeCompare(b.name);
          return a.type === "dir" ? -1 : 1;
        });

        if (currentPath) {
          const up = document.createElement("div");
          up.className = "file enter";
          up.innerHTML = `<span>⬆</span> ..`;
          up.onclick = () => {
            currentPath = currentPath.split("/").slice(0,-1).join("/");
            loadPath();
          };
          fileList.appendChild(up);
        }

        files.forEach((f, i) => {
          const div = document.createElement("div");
          div.className = "file";
          div.style.animationDelay = (i * 0.02) + "s";
          const icon = f.type === "dir" ? "📁" : "📄";
          div.innerHTML = `<span>${icon}</span> ${f.name}`;
          if (f.type === "dir") {
             div.onclick = () => {
                currentPath = currentPath ? currentPath + "/" + f.name : f.name;
                loadPath();
              };
          }
          fileList.appendChild(div);
        });
      } catch (e) {
        fileList.innerHTML = '<div class="status-msg">error loading files.</div>';
      }
    }

    function closeRepo() {
      viewer.classList.remove("open");
      document.body.style.overflow = "";
    }

    // Start fetching
    fetchAllRepos();
  </script>
</body>
</html>
